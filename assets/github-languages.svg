  <text x="690" y="206" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="600" text-anchor="end">2 repos  ·  11%</text>
  <rect x="54" y="214" width="590" height="7" rx="4" fill="#202b4c"/>
