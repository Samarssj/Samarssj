  <circle cx="36" cy="235" r="6" fill="#f1e05a"/>
  <text x="54" y="240" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="600" text-anchor="start">JavaScript</text>
  <text x="690" y="240" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="600" text-anchor="end">1 repo  ·  6%</text>
  <rect x="54" y="248" width="590" height="7" rx="4" fill="#202b4c"/>
  <rect x="54" y="248" width="24" height="7" rx="4" fill="#f1e05a" filter="url(#glow)"/>
  <rect x="28" y="272" width="664" height="1" fill="#26345c"/>
