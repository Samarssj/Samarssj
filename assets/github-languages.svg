<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-labelledby="title desc">
  <title id="title">Repository language donut chart for Samar Singh</title>
  <desc id="desc">Live GitHub analytics for Samarssj, generated from GitHub API data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="52%" stop-color="#111936"/>
      <stop offset="100%" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="52%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="waveLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="52%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" rx="22" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="100%" height="5" rx="3" fill="url(#accent)"/>
  <text x="28" y="44" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="28px" font-weight="700" text-anchor="start">Repository DNA</text>
  <text x="28" y="71" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="400" text-anchor="start">Language mix across active repositories</text>
  <text x="690" y="50" fill="#22d3ee" font-family="Arial, Helvetica, sans-serif" font-size="28px" font-weight="700" text-anchor="end">21</text>
  <text x="690" y="72" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="700" text-anchor="end" letter-spacing="1px">PUBLIC REPOS</text>
  <circle cx="175" cy="190" r="92" fill="none" stroke="#202b4c" stroke-width="30"/>
  <circle cx="175" cy="190" r="92" fill="none" stroke="#3776ab" stroke-width="30" stroke-linecap="round" stroke-dasharray="238.39 578.05" stroke-dashoffset="-0.00" transform="rotate(-90 175 190)" filter="url(#glow)"><title>Python: 8 repositories</title></circle>
  <circle cx="175" cy="190" r="92" fill="none" stroke="#e34c26" stroke-width="30" stroke-linecap="round" stroke-dasharray="116.70 578.05" stroke-dashoffset="-243.39" transform="rotate(-90 175 190)" filter="url(#glow)"><title>HTML: 4 repositories</title></circle>
  <circle cx="175" cy="190" r="92" fill="none" stroke="#8b5cf6" stroke-width="30" stroke-linecap="round" stroke-dasharray="86.27 578.05" stroke-dashoffset="-365.09" transform="rotate(-90 175 190)" filter="url(#glow)"><title>TypeScript: 3 repositories</title></circle>
  <circle cx="175" cy="190" r="92" fill="none" stroke="#da5b0b" stroke-width="30" stroke-linecap="round" stroke-dasharray="86.27 578.05" stroke-dashoffset="-456.36" transform="rotate(-90 175 190)" filter="url(#glow)"><title>Jupyter Notebook: 3 repositories</title></circle>
  <circle cx="175" cy="190" r="92" fill="none" stroke="#f1e05a" stroke-width="30" stroke-linecap="round" stroke-dasharray="25.42 578.05" stroke-dashoffset="-547.63" transform="rotate(-90 175 190)" filter="url(#glow)"><title>JavaScript: 1 repositories</title></circle>
  <circle cx="175" cy="190" r="60" fill="#111936" stroke="#26345c"/>
  <text x="175" y="187" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30px" font-weight="700" text-anchor="middle">21</text>
  <text x="175" y="211" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="700" text-anchor="middle" letter-spacing="1px">REPOS</text>
  <circle cx="360" cy="103" r="6" fill="#3776ab"/>
  <text x="378" y="108" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="600" text-anchor="start">Python</text>
  <text x="690" y="108" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="600" text-anchor="end">8 repos  ·  42%</text>
  <circle cx="360" cy="134" r="6" fill="#e34c26"/>
  <text x="378" y="139" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="600" text-anchor="start">HTML</text>
  <text x="690" y="139" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="600" text-anchor="end">4 repos  ·  21%</text>
  <circle cx="360" cy="165" r="6" fill="#8b5cf6"/>
  <text x="378" y="170" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="600" text-anchor="start">TypeScript</text>
  <text x="690" y="170" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="600" text-anchor="end">3 repos  ·  16%</text>
  <circle cx="360" cy="196" r="6" fill="#da5b0b"/>
  <text x="378" y="201" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="600" text-anchor="start">Jupyter Notebook</text>
  <text x="690" y="201" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="600" text-anchor="end">3 repos  ·  16%</text>
  <circle cx="360" cy="227" r="6" fill="#f1e05a"/>
  <text x="378" y="232" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="600" text-anchor="start">JavaScript</text>
  <text x="690" y="232" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="600" text-anchor="end">1 repo  ·  5%</text>
  <rect x="28" y="312" width="664" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>
  <text x="28" y="330" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11px" font-weight="600" text-anchor="start">Donut share  ·  ranked by repository count  ·  refreshed with GitHub</text>
</svg>
