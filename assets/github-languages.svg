  <text x="690" y="48" fill="#22d3ee" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" text-anchor="end">20</text>
  <text x="690" y="68" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10px" font-weight="700" text-anchor="end" letter-spacing="1px">PUBLIC REPOS</text>
