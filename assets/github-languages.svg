  <text x="690" y="138" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="600" text-anchor="end">4 repos  ·  22%</text>
  <rect x="54" y="146" width="590" height="7" rx="4" fill="#202b4c"/>
  <rect x="54" y="146" width="96" height="7" rx="4" fill="#e34c26" filter="url(#glow)"/>
  <circle cx="36" cy="167" r="6" fill="#3178c6"/>
