  <text x="690" y="172" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12px" font-weight="600" text-anchor="end">3 repos  ·  17%</text>
  <rect x="54" y="180" width="590" height="7" rx="4" fill="#202b4c"/>
  <rect x="54" y="180" width="72" height="7" rx="4" fill="#3178c6" filter="url(#glow)"/>
  <circle cx="36" cy="201" r="6" fill="#da5b0b"/>
