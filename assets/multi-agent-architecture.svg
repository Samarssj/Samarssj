<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Live agentic AI multi-agent architecture</title>
  <desc id="desc">An animated orchestrator routes a user goal through planning, research, tools, evaluation, and shared memory before returning an answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111936"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="52%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18234d"/>
      <stop offset="1" stop-color="#17152e"/>
    </linearGradient>
    <radialGradient id="orchestrator" cx="35%" cy="25%">
      <stop offset="0" stop-color="#2d4a82"/>
      <stop offset="0.6" stop-color="#1b2752"/>
      <stop offset="1" stop-color="#17152e"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <path id="pathGoal" d="M195 215 C310 215 380 215 480 215"/>
    <path id="pathPlan" d="M530 150 C475 128 438 105 400 88"/>
    <path id="pathResearch" d="M530 270 C475 292 438 320 400 342"/>
    <path id="pathTools" d="M670 150 C725 128 762 105 800 88"/>
    <path id="pathEvaluate" d="M670 270 C725 292 762 320 800 342"/>
    <path id="pathMemory" d="M600 280 C600 300 600 312 600 326"/>
    <path id="pathReturn" d="M800 342 C760 385 690 390 635 280"/>
  </defs>

  <rect width="1200" height="430" rx="24" fill="#030608"/>
  <rect x="8" y="8" width="1184" height="414" rx="20" fill="url(#bg)" stroke="#26345c" stroke-width="2"/>
  <rect x="16" y="16" width="1168" height="398" rx="16" fill="url(#grid)"/>
  <path d="M34 82H1166M34 366H1166" stroke="#a78bfa" stroke-opacity="0.15" stroke-dasharray="2 12"/>
  <path d="M42 42H220M980 42H1158M42 390H260M940 390H1158" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="46" cy="42" r="3" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="1154" cy="42" r="3" fill="#22d3ee" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="58" y="34" fill="#22d3ee" font-size="11" letter-spacing="3">AGENTIC AI / MULTI-AGENT RUNTIME</text>
    <text x="1142" y="34" fill="#a78bfa" font-size="10" text-anchor="end" letter-spacing="2">LIVE ORCHESTRATION</text>
    <text x="600" y="405" fill="#688078" font-size="10" text-anchor="middle" letter-spacing="2">PLAN  →  ACT  →  OBSERVE  →  EVALUATE  →  RESPOND</text>
  </g>

  <g fill="none" stroke-linecap="round">
    <g stroke="#263b75" stroke-width="5" opacity="0.75">
      <use href="#pathGoal"/><use href="#pathPlan"/><use href="#pathResearch"/><use href="#pathTools"/><use href="#pathEvaluate"/><use href="#pathMemory"/><use href="#pathReturn"/>
    </g>
    <g class="flow" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="10 14">
      <use href="#pathGoal"/><use href="#pathPlan"/><use href="#pathResearch"/><use href="#pathTools"/><use href="#pathEvaluate"/><use href="#pathMemory"/><use href="#pathReturn"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#22d3ee" filter="url(#glow)">
    <circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#pathGoal"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="-.7s" repeatCount="indefinite"><mpath href="#pathPlan"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.9s" begin="-.9s" repeatCount="indefinite"><mpath href="#pathResearch"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.5s" begin="-.4s" repeatCount="indefinite"><mpath href="#pathTools"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.7s" begin="-1.1s" repeatCount="indefinite"><mpath href="#pathEvaluate"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.2s" begin="-.8s" repeatCount="indefinite"><mpath href="#pathMemory"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.2s" begin="-1.5s" repeatCount="indefinite"><mpath href="#pathReturn"/></animateMotion></circle>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(46 178)">
      <rect width="150" height="74" rx="14" fill="url(#agent)" stroke="#22d3ee" stroke-opacity="0.7"/>
      <circle cx="24" cy="26" r="8" fill="#22d3ee" filter="url(#glow)"/>
      <text x="44" y="30" fill="#f8fafc" font-size="14" font-weight="700">USER GOAL</text>
      <text x="18" y="53" fill="#94a3b8" font-size="11">intent + context</text>
    </g>

    <g transform="translate(275 44)">
      <rect width="170" height="70" rx="14" fill="url(#agent)" stroke="#a78bfa" stroke-opacity="0.75"/>
      <circle cx="24" cy="25" r="8" fill="#a78bfa" filter="url(#glow)"/>
      <text x="44" y="29" fill="#f8fafc" font-size="14" font-weight="700">PLANNER AGENT</text>
      <text x="18" y="51" fill="#94a3b8" font-size="11">decompose + route</text>
    </g>

    <g transform="translate(275 307)">
      <rect width="170" height="70" rx="14" fill="url(#agent)" stroke="#22d3ee" stroke-opacity="0.75"/>
      <circle cx="24" cy="25" r="8" fill="#22d3ee" filter="url(#glow)"/>
      <text x="44" y="29" fill="#f8fafc" font-size="12" font-weight="700">RESEARCH AGENT</text>
      <text x="18" y="51" fill="#94a3b8" font-size="11">retrieve + ground</text>
    </g>

    <g transform="translate(755 44)">
      <rect width="170" height="70" rx="14" fill="url(#agent)" stroke="#f472b6" stroke-opacity="0.75"/>
      <circle cx="24" cy="25" r="8" fill="#f472b6" filter="url(#glow)"/>
      <text x="44" y="29" fill="#f8fafc" font-size="14" font-weight="700">TOOL AGENT</text>
      <text x="18" y="51" fill="#94a3b8" font-size="11">act + observe</text>
    </g>

    <g transform="translate(755 307)">
      <rect width="170" height="70" rx="14" fill="url(#agent)" stroke="#fb923c" stroke-opacity="0.75"/>
      <circle cx="24" cy="25" r="8" fill="#fb923c" filter="url(#glow)"/>
      <text x="44" y="29" fill="#f8fafc" font-size="14" font-weight="700">EVALUATOR</text>
      <text x="18" y="51" fill="#94a3b8" font-size="11">score + refine</text>
    </g>
  </g>

  <g transform="translate(600 215)" font-family="Arial, Helvetica, sans-serif">
    <circle r="86" fill="#22d3ee" fill-opacity="0.09" filter="url(#softGlow)">
      <animate attributeName="r" values="76;92;76" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.06;0.28" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="70" fill="url(#orchestrator)" stroke="url(#accent)" stroke-width="3"/>
    <circle r="56" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <path d="M-22 0H22M0-22V22" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle r="10" fill="#f8fafc" stroke="#22d3ee" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-35" fill="#f8fafc" font-size="15" font-weight="800" text-anchor="middle">ORCHESTRATOR</text>
    <text x="0" y="45" fill="#94a3b8" font-size="11" text-anchor="middle" letter-spacing="1">PLAN / ROUTE / SYNTHESIZE</text>
  </g>

  <g transform="translate(500 326)" font-family="Arial, Helvetica, sans-serif">
    <rect width="200" height="48" rx="12" fill="#111936" stroke="#a78bfa" stroke-opacity="0.65"/>
    <circle cx="22" cy="24" r="7" fill="#a78bfa" filter="url(#glow)"/>
    <text x="38" y="22" fill="#f8fafc" font-size="12" font-weight="700">SHARED MEMORY</text>
    <text x="38" y="36" fill="#94a3b8" font-size="10">state · traces · context</text>
  </g>

  <style>
    .flow { animation: flow 1.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
      animate, animateMotion, animateTransform { display: none; }
    }
  </style>
</svg>
