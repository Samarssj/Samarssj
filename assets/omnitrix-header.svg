<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Samar Singh — Omnitrix-inspired profile header</title>
  <desc id="desc">A dark futuristic profile header with a spinning Omnitrix emblem and Samar Singh's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111936"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="52%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2d9d5"/>
      <stop offset="0.25" stop-color="#6c7977"/>
      <stop offset="0.6" stop-color="#273333"/>
      <stop offset="1" stop-color="#899692"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff72"/>
      <stop offset="0.35" stop-color="#a9f000"/>
      <stop offset="0.72" stop-color="#54c800"/>
      <stop offset="1" stop-color="#1e7800"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="25%">
      <stop offset="0" stop-color="#f1ffb0"/>
      <stop offset="0.22" stop-color="#baff18"/>
      <stop offset="0.62" stop-color="#78e000"/>
      <stop offset="1" stop-color="#2c9200"/>
    </radialGradient>
    <filter id="greenGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="screenClip"><rect x="16" y="16" width="1168" height="228" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="260" rx="26" fill="#030608"/>
  <rect x="8" y="8" width="1184" height="244" rx="22" fill="url(#bg)" stroke="#26345c" stroke-width="2"/>
  <rect x="16" y="16" width="1168" height="228" rx="22" fill="url(#grid)" clip-path="url(#screenClip)"/>
  <path d="M28 72H1172M28 188H1172" stroke="#a78bfa" stroke-opacity="0.18" stroke-dasharray="2 12"/>
  <path d="M44 42H196M1004 42H1156M44 218H250M950 218H1156" stroke="#22d3ee" stroke-opacity="0.42" stroke-width="2"/>
  <circle cx="48" cy="42" r="3" fill="#22d3ee" filter="url(#textGlow)"/>
  <circle cx="1152" cy="42" r="3" fill="#22d3ee" filter="url(#textGlow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
    <text x="76" y="66" fill="#22d3ee" font-size="12" letter-spacing="4" opacity="0.9">PROFILE SYSTEM // ONLINE</text>
    <text x="76" y="170" fill="#a6b5ad" font-size="11.5" letter-spacing="1.5" textLength="790" lengthAdjust="spacingAndGlyphs">AI DEVELOPER · MACHINE LEARNING ENTHUSIAST · BUILDER OF INTELLIGENT SYSTEMS</text>
    <text x="76" y="205" fill="#688078" font-size="11" letter-spacing="2">IDENTITY VERIFIED  /  INTELLIGENCE MODULES READY</text>
  </g>

  <text x="74" y="132" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="5" filter="url(#textGlow)">SAMAR SINGH</text>
  <path d="M76 146H620" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M76 151H420" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.3"/>

  <g transform="translate(1012 130)">
    <circle r="94" fill="#020608" stroke="#394a47" stroke-width="5"/>
    <circle r="82" fill="#0e1d20" stroke="url(#metal)" stroke-width="11"/>
    <circle r="65" fill="#050a0b" stroke="#7a8985" stroke-width="8"/>
    <circle r="55" fill="#11191b" stroke="#1d2928" stroke-width="3"/>
    <g opacity="0.9" fill="none" stroke="#a78bfa" stroke-width="2">
      <path d="M0-103V-91M0 91V103M-103 0H-91M91 0H103"/>
      <path d="M-73-73l8 8M73 73l8 8M73-73l-8 8M-73 73l8-8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="-92" r="12" fill="#25322f" stroke="#85968d" stroke-width="4"/>
      <circle cx="0" cy="-92" r="7" fill="url(#core)" filter="url(#greenGlow)"/>
      <circle cx="92" cy="0" r="12" fill="#25322f" stroke="#85968d" stroke-width="4"/>
      <circle cx="92" cy="0" r="7" fill="url(#core)" filter="url(#greenGlow)"/>
      <circle cx="0" cy="92" r="12" fill="#25322f" stroke="#85968d" stroke-width="4"/>
      <circle cx="0" cy="92" r="7" fill="url(#core)" filter="url(#greenGlow)"/>
      <circle cx="-92" cy="0" r="12" fill="#25322f" stroke="#85968d" stroke-width="4"/>
      <circle cx="-92" cy="0" r="7" fill="url(#core)" filter="url(#greenGlow)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <path d="M-38-45Q0-57 38-45L10-8Q5-2 0 0Q-5-2-10-8Z" fill="url(#glass)" stroke="#020608" stroke-width="8" stroke-linejoin="round"/>
      <path d="M-38 45Q0 57 38 45L10 8Q5 2 0 0Q-5 2-10 8Z" fill="url(#glass)" stroke="#020608" stroke-width="8" stroke-linejoin="round"/>
      <path d="M-45-38Q-57 0-45 38L-8 10Q-2 5 0 0Q-2-5-8-10Z" fill="#68716f" stroke="#020608" stroke-width="8" stroke-linejoin="round"/>
      <path d="M45-38Q57 0 45 38L8 10Q2 5 0 0Q2-5 8-10Z" fill="#68716f" stroke="#020608" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>

  <g font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="2">
    <text x="855" y="227">OMNITRIX CORE / ACTIVE</text>
    <text x="1115" y="227">01</text>
  </g>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animateTransform, animate { display: none; }
    }
  </style>
</svg>
