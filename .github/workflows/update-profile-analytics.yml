name: Update profile analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    paths:
      - ".github/workflows/update-profile-analytics.yml"
      - "scripts/generate_profile_analytics.py"

permissions:
  contents: write

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate analytics SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_analytics.py

      - name: Commit refreshed analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-contributions.svg
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
          else
            git commit -m "Update profile analytics"
            git push
          fi
